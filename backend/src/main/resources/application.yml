spring:
  application:
    name: palak-mistan-bhandar-backend

  datasource:
    url: jdbc:h2:mem:palakdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
  expiration: 86400000

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.palakmistandbhandar: DEBUG
    org.springframework.security: INFO
